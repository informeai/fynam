name: release

# Publica uma GitHub Release com os binários de cada plataforma.
#
# Dois gatilhos:
#   - workflow_dispatch: rode pela aba "Actions" do GitHub informando a versão
#     (ex.: 0.3.0). A tag vX.Y.Z é criada junto com a release.
#   - push de uma tag "v*": mantém o fluxo antigo (git tag v0.3.0 && git push --tags).
#
# Os nomes dos assets seguem o padrão que o internal/updater (go-selfupdate)
# espera, e um checksums.txt é gerado para a validação SHA-256 no cliente.
#
# No workflow_dispatch o job "prepare" faz o bump de wails.json
# (info.productVersion) e commita "Release vX.Y.Z" no branch escolhido (main),
# e é esse commit que vira a tag/release. No push de tag "v*" o bump é seu,
# feito antes de criar a tag.
#
# Requer que o branch de destino aceite push do GITHUB_TOKEN (sem branch
# protection exigindo PR/approvals para o github-actions[bot]).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a lançar em semver, sem o 'v' (ex.: 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VER="${RAW#v}"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)*$'; then
            echo "::error::Versão inválida: '$RAW'. Use semver, ex.: 0.3.0"
            exit 1
          fi
          TAG="v$VER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A tag $TAG já existe — escolha outra versão."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "Lançando $TAG"

      - id: rev
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ steps.v.outputs.version }}"
            node -e "const f='wails.json';const j=require('./'+f);j.info=j.info||{};j.info.productVersion='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
            if git diff --quiet -- wails.json; then
              echo "wails.json já está em $VER — sem commit."
            else
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Release v$VER" -- wails.json
              git push origin "HEAD:${GITHUB_REF_NAME}"
              echo "Bump para $VER commitado em $GITHUB_REF_NAME."
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/universal
            asset: fynam_darwin_universal.tar.gz
            buildflags: ""
          - os: windows-latest
            platform: windows/amd64
            asset: fynam_windows_amd64.zip
            buildflags: ""
          - os: ubuntu-latest
            platform: linux/amd64
            asset: fynam_linux_amd64.tar.gz
            # Ubuntu 24.04 só tem webkit2gtk-4.1; a tag faz o Wails compilar contra ela.
            buildflags: "-tags webkit2_41"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Aplicar a versão em wails.json
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          node -e "const f='wails.json';const j=require('./'+f);j.info=j.info||{};j.info.productVersion='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          cat wails.json

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -trimpath ${{ matrix.buildflags }}

      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "build/bin/fynam.app/Contents/MacOS" -czf "dist/${{ matrix.asset }}" fynam

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -C build/bin -czf "dist/${{ matrix.asset }}" fynam

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/fynam.exe -DestinationPath "dist/${{ matrix.asset }}"

      # Instalador .msi via WiX Toolset v5 (dotnet tool, roda no runner windows-latest).
      - name: Instalar WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Gerar o .msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ProductVersion do MSI aceita só X.Y.Z numérico — descarta sufixos semver (-rc1, +build).
          $msiVersion = "${{ needs.prepare.outputs.version }}" -replace '[-+].*$', ''
          wix build build/windows/wix/fynam.wxs `
            -arch x64 `
            -d ProductVersion=$msiVersion `
            -d BinDir=build/bin `
            -ext WixToolset.UI.wixext `
            -o "dist/fynam_windows_amd64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: fynam_windows_amd64.msi
          path: dist/fynam_windows_amd64.msi

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums.txt
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt

      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          target=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target=(--target "${{ needs.prepare.outputs.sha }}")
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            "${target[@]}" \
            --generate-notes
